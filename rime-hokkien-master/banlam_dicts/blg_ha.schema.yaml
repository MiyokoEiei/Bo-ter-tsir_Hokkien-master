translator:
  dictionary: banlam
  preedit_format:
  initial_quality: 100001
  preedit_format:
    #通用
    - 'xform z ts'
    - 'xform q kh'
    - 'xform f ph'
    - 'xform w oo'
    - 'xform c tsh'
    - 'xform y inn'
    - 'xform v th'
    - 'xform uy uinn'
    - 'xform ya iann'
    - 'xform innu iunn'
    - 'xform inna iann'
    - 'xform yu iunn'
    - 'xform yu iunn'
    - 'xform iw ioo'
    - 'xform x ~'
    - 'xform einn enn'
    - 'xform ey enn'
    - 'xform yau iaunn'
    - 'xform innau iaunn'
    - 'xform iannu iaunn'
  enable_user_dict: true
  enable_sentence: false
  enable_encoder: true
  enable_completion: true
  enable_encoder: false
  encode_commit_history: true
  spelling_hints: 0

luna_pinyin:
  dictionary: luna_pinyin
  prefix: "`"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nljqxy])v/$1ü/

dmode:
  dictionary: dmode
  prefix: "`"
  tips: 〔文讀拆字〕

history_repeat:
  input: x
  size: 1
  initial_quality: 1

bangul:
  dictionary: bangul
  initial_quality: 100001
  enable_sentence: false
  enable_user_dict: false
  enable_completion: false
  comment_format:
    - xform/.*//
hutsoo:
  dictionary: hutsoo
  initial_quality: 100001
  enable_sentence: false
  enable_user_dict: false
  enable_completion: false
  comment_format:
    - xform/.*//
recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*`?$"
    dmode_lookup: "/[a-z]*`?$"
punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: minus, send: minus }  # 第7調
    - { when: paging, accept: minus, send: Page_Up }


