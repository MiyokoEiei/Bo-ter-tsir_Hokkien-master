    - derive/ngOO/go/												#廈漳，例字：俄（羅斯）、鰲（拜）
    #- derive/nGoo/goo/												#泉音，例字：（一九二）五、中午
    - derive/nGoo/ngoo/												#廈漳，例字：（一九二）五、中午
    - derive/goo/ngoo/												#廈泉，例字：（會）晤、梧（桐樹）
