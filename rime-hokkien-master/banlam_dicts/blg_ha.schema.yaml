# Rime schema
# vim: set sw=2 sts=2 et:
# encoding: utf-8

schema:
  schema_id: blg_ha
  name: 閩南語廈門音
  version: "20261018"
  author:
    - 阿托 <a-thok@outlook.com>
    - 沒袋子 <tenn_tik_u@qq.com>
  description: |
    閩南語輸入方案，
    顯示字符採用「臺灣閩南語羅馬字拼音方案」，鍵入方式有改動；
    speller參考洪惟仁《閩南地區方言地圖集》的分類方法予以標註。
    p.s. 「輸入法設定」中，務請不要同時勾選兩種（及以上）閩南語腔口方案，否則各方案中speller部分可能失靈。
  dependencies:
    - bangul
    - luna_pinyin
    - hutsoo
switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, En ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢, 汉 ]
  - name: phraseComment
    reset: 1        # 1 表示默认开启，0 表示默认关闭
    # states: [關閉註釋, 開啓註釋]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - echo_translator
    - punct_translator
    - r10n_translator
    - reverse_lookup_translator@luna_pinyin
    - table_translator@bangul
    - table_translator@hutsoo
    - reverse_lookup_translator@dmode
    - history_translator@history_repeat
  filters:
    - simplifier
    - uniquifier
    - lua_filter@phraseComment_Filter				# 短语释义
    #- lua_filter@dateTime_filter
speller:
  alphabet: 'abcdefghijklnmopqrstuvwyzABCDEFGHIJKLMNOPQRSTUVWXYZ~[/\]90-;x'
  initials: xvzywutsrqponmlkjihgfedcbaABCDEFGHIJKLMNOPQRSTUVWXYZ
  delimiter: " '"
  algebra:
    - abbrev/^([xvzywutsrqponmlkjihgfedcbaABCDEFGHIJKLMNOPQRSTUVWXYZ]h?).+$/$1/ 
    - derive/^([a-z]+)\d$/$1/
#聲母（以下各詞條最前方添加井號"#"即可取消詞條效果，詞條功效請見後綴說明）
    #- derive/^j/l/														#入歸柳
    #- derive/l/d/														#常見拼寫形式
    - derive/^th/v/														#簡化拼式
    - derive/^ph/f/													#簡化拼式
    - derive/^sC/s/													#泉，例字：（飯）勺、（形）象、（畫）像
    #- derive/^sC/c/													#漳，例字：（飯）勺、（形）象、（畫）像
    - derive/^tC/t/													#泉，例字：（古道熱）腸
    #- derive/^tC/c/												#漳，例字：（古道熱）腸
    - derive/^tZ/t/													#泉，例字：着（力）
    #- derive/^tZ/z/												#漳，例字：着（力）
    #- derive/mau/bau/
    - derive/^jZ/j/														#漳，例字：（表）字
    - derive/^jC/j/														#漳，例字：揤（門鈴）
    #- derive/^jZ/z/														#泉，例字：（表）字
    #- derive/^jC/c/														#泉，例字：揤（門鈴）
    #- derive/^nD/n/													#泉，例字：（馬）爾（代夫）、（李）耳
    - derive/^nD/j/													#漳，例字：（馬）爾（代夫）、（李）耳
#韻母
##陰聲韻
    #- derive/ian/en/													#臺音
    #- derive/iat/et/												#臺音
###高沽文（例字：芋（仔）、（落）雨）
    - derive/oo/w/														#主流，簡化拼式
    #- derive/oo/ou/													#漳南、長泰、龍涓
###西嘉白（例字：加（少）、蝦（仔））
    - derive/ee/e/													#泉音
    - derive/^([mn]g?)ee/$1i/									#廈音，例字：（較）猛、硬（死）
    #- derive/aE$/ee/								#漳音，例字：加（錢）、炸（彈）
    - derive/aE$/a/								#泉廈音，例字：加（錢）、炸（彈）
###毛扛白（例字：（頭）毛、兩（个））
